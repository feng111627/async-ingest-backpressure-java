server.port=0

# 异步写入通道配置
ingest.max-pending=1000
ingest.backpressure-strategy=REJECT
ingest.block-timeout=5s
ingest.max-retries=3
ingest.retry-backoff=50ms
ingest.worker-threads=8
ingest.shutdown-timeout=10s

# 熔断冷却与半开试探
ingest.circuit-cooldown=30s
# 空闲键状态回收
ingest.max-keys=10000
ingest.key-idle-timeout=10m
ingest.reap-interval=30s
